<!DOCTYPE html>
<!-- Source for og.png (1200x630). Render: open at 1200x630 and screenshot, see README. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#060608;font-family:Geist,sans-serif;color:#f5f5f7;-webkit-font-smoothing:antialiased}
.a{position:absolute;border-radius:50%;width:900px;height:900px}
.a1{left:-380px;top:-460px;background:radial-gradient(closest-side,rgba(255,138,31,.5),transparent 72%)}
.a2{right:-420px;top:-200px;background:radial-gradient(closest-side,rgba(43,107,255,.45),transparent 72%)}
.a3{left:200px;bottom:-640px;background:radial-gradient(closest-side,rgba(255,94,58,.3),transparent 72%)}
.copy{position:absolute;left:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:560px}
.eb{font:600 15px/1 Geist;letter-spacing:.1em;text-transform:uppercase;color:rgba(235,235,245,.5);margin-bottom:22px}
h1{font-size:132px;font-weight:700;letter-spacing:-.06em;line-height:.9}
.sub{margin-top:26px;font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.sub span{color:rgba(235,235,245,.42)}
.url{margin-top:44px;display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font:500 20px/1 'Geist Mono';color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.08)}
.url i{width:10px;height:10px;border-radius:50%;background:#34d36a;box-shadow:0 0 12px #34d36a}
.card{position:absolute;right:84px;top:75px;width:380px;height:480px;border-radius:44px;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1),0 40px 80px -30px rgba(0,0,0,.8)}
.card .bg{position:absolute;inset:-25%;z-index:-1;background:url(../cat-avatar.png) center/cover;filter:blur(44px) saturate(1.9) brightness(.8)}
.card .av{width:190px;height:190px;border-radius:50%;padding:5px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 50%,rgba(255,255,255,.25));box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.card .av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.card b{margin-top:26px;font-size:44px;letter-spacing:-.05em}
.card small{margin-top:6px;font-size:18px;color:rgba(255,255,255,.75)}
</style></head><body>
<div class="a a1"></div><div class="a a2"></div><div class="a a3"></div>
<div class="copy">
  <div class="eb">Portfolio</div>
  <h1>TreXito</h1>
  <div class="sub">IT systems, game automation.<br><span>Creator of Frikadellen BAF.</span></div>
  <div class="url"><i></i>trexito.com</div>
</div>
<div class="card"><div class="bg"></div><div class="av"><img src="../cat-avatar.png" alt=""></div><b>TreXito</b><small>Studying at 42</small></div>
</body></html>
